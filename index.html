<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Travel Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        /* Smooth loading animation for the cards */
        .fade-in-up { animation: fadeInUp 0.8s ease-out forwards; opacity: 0; transform: translateY(20px); }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen p-6 md:p-12 font-sans selection:bg-blue-500 selection:text-white">
    <div class="max-w-5xl mx-auto">
        
        <!-- Input Dashboard -->
        <div class="bg-gray-800/50 backdrop-blur-xl p-8 rounded-3xl shadow-2xl mb-12 border border-gray-700/50">
            <h1 class="text-4xl font-black mb-2 tracking-tight">AI Travel <span class="text-blue-500">Architect</span></h1>
            <p class="text-gray-400 mb-8">Your cinematic, perfectly optimized itinerary generator.</p>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <input type="text" id="destinationInput" placeholder="Where to? (e.g. Tokyo)" class="p-4 bg-gray-900/80 rounded-xl border border-gray-700 w-full focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                <input type="number" id="daysInput" placeholder="How many days?" class="p-4 bg-gray-900/80 rounded-xl border border-gray-700 w-full focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                <select id="styleInput" class="p-4 bg-gray-900/80 rounded-xl border border-gray-700 w-full focus:ring-2 focus:ring-blue-500 outline-none transition-all cursor-pointer">
                    <option value="Backpacker">Backpacker (Budget)</option>
                    <option value="Comfort">Comfort (Standard)</option>
                    <option value="Luxury">Luxury (Premium)</option>
                </select>
            </div>
            
            <button id="planButton" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 px-6 rounded-xl transition-all flex justify-center items-center gap-3 shadow-lg shadow-blue-900/20 active:scale-[0.99]">
                <span id="buttonText">Consult AI Brain...</span>
                <div id="loadingSpinner" class="hidden animate-spin h-5 w-5 border-2 border-white border-t-transparent rounded-full"></div>
            </button>
        </div>

        <!-- Dynamic Results Area -->
        <div id="resultsContainer" class="hidden">
            <div class="flex flex-col md:flex-row md:items-end justify-between mb-10 border-b border-gray-700/50 pb-6 gap-4">
                <h2 class="text-4xl font-black tracking-tight">Your <span class="text-blue-500">Blueprint</span></h2>
                <span id="tripMeta" class="text-gray-300 font-medium bg-gray-800/80 px-5 py-2 rounded-full border border-gray-700 text-sm tracking-wide"></span>
            </div>
            
            <!-- This is where the JS will inject the beautiful cards -->
            <div id="itineraryGrid" class="flex flex-col gap-10"></div>
        </div>

    </div>
    <script src="script.js?v=fresh"></script>
</body>
</html>
