<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Travel Architect</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom animations -->
    <style>
        .fade-in-up {
            animation: fadeInUp 0.5s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        /* Smooth scrolling for results */
        html {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body class="bg-gray-950 text-white min-h-screen font-sans">
    
    <!-- Main Wrapper -->
    <div class="max-w-4xl mx-auto p-6 md:p-12">
        
        <!-- Header -->
        <header class="text-center mb-12">
            <h1 class="text-4xl md:text-5xl font-black mb-4 tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500">
                AI Travel Architect
            </h1>
            <p class="text-gray-400 text-lg font-light">Build impossible itineraries in seconds.</p>
        </header>

        <!-- The Command Center (Form) -->
        <div class="bg-gray-900 p-6 md:p-8 rounded-3xl shadow-2xl border border-gray-800 mb-12 fade-in-up">
            
            <!-- THE MULTI-DESTINATION BUILDER -->
            <div class="flex flex-col gap-3 w-full mb-6">
                <label class="text-sm text-gray-400 font-bold uppercase tracking-wider">Destinations & Days</label>
                
                <!-- Container for the dynamic rows -->
                <div id="destinationsList" class="flex flex-col gap-3">
                    <!-- Initial Destination Row -->
                    <div class="destination-row flex gap-2 w-full">
                        <input type="text" class="dest-input w-2/3 p-4 rounded-xl bg-gray-800 text-white border border-gray-700 focus:border-blue-500 outline-none shadow-inner transition-colors" placeholder="E.g., Tokyo, Japan">
                        <input type="number" class="days-input w-1/3 p-4 rounded-xl bg-gray-800 text-white border border-gray-700 focus:border-blue-500 outline-none shadow-inner transition-colors" placeholder="Days" min="1" value="3">
                    </div>
                </div>
                
                <!-- Add Destination Button -->
                <button id="addDestBtn" class="text-blue-400 text-sm font-bold text-left hover:text-blue-300 transition-colors w-max tracking-wide mt-1">
                    + Add another destination
                </button>
            </div>

            <!-- Travel Style Dropdown -->
            <div class="mb-8">
                <label class="text-sm text-gray-400 font-bold uppercase tracking-wider mb-2 block">Travel Style</label>
                <select id="styleInput" class="w-full p-4 rounded-xl bg-gray-800 text-white border border-gray-700 focus:border-blue-500 outline-none appearance-none shadow-inner transition-colors">
                    <option value="Backpacker">🎒 Backpacker (Budget, Hostels, Street Food)</option>
                    <option value="Comfort" selected>🏨 Comfort (3-4 Star, Guided Tours, Nice Dining)</option>
                    <option value="Luxury">✨ Luxury (5-Star, Private Transfers, Fine Dining)</option>
                </select>
            </div>

            <!-- Generate Button -->
            <button id="planButton" class="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white font-bold text-lg p-4 rounded-xl shadow-lg hover:shadow-blue-500/25 transition-all transform hover:-translate-y-1 flex justify-center items-center gap-3">
                <span id="buttonText">Plan My Trip</span>
                
                <!-- Loading Spinner (Hidden until clicked) -->
                <svg id="loadingSpinner" class="hidden animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>
        </div>

        <!-- The Results Vault (Hidden until generation is complete) -->
        <div id="resultsContainer" class="hidden fade-in-up">
            <div class="text-center mb-10">
                <h2 class="text-3xl font-bold mb-2 text-white">Your Itinerary</h2>
                <p id="tripMeta" class="text-gray-400 font-medium tracking-wide"></p>
            </div>
            
            <!-- Cards will be injected into this grid by Javascript -->
            <div id="itineraryGrid" class="flex flex-col gap-8"></div>
        </div>

    </div>

    <!-- Link to the Javascript engine -->
    <script src="script.js"></script>
</body>
</html>
